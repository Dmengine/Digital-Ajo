            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;

<body class="bg-surface text-on-surface font-body min-h-screen flex flex-col">
<!-- TopAppBar Fragment (Shared Component Integration) -->
<header class="fixed top-0 w-full z-50 bg-[#1D2023]/70 backdrop-blur-xl flex justify-between items-center px-6 py-6 w-full bg-gradient-to-b from-[#111417] to-transparent">
<div class="flex items-center gap-2">
<span class="text-[#D6BAFF] font-black italic font-headline text-2xl tracking-tight">ContriPay</span>
</div>
<div class="p-2 rounded-full hover:opacity-80 transition-opacity active:scale-95 transition-all duration-200">
<span class="material-symbols-outlined text-[#D6BAFF]">shield</span>
</div>
</header>
<main class="flex-grow flex items-center justify-center px-6 pt-24 pb-12 relative overflow-hidden">
<!-- Background Ambient Glow -->
<div class="absolute top-1/4 left-1/4 w-96 h-96 bg-primary-container/10 blur-[100px] rounded-full"></div>
<div class="absolute bottom-1/4 right-1/4 w-64 h-64 bg-secondary/5 blur-[80px] rounded-full"></div>
<div class="w-full max-w-md relative z-10">
<!-- Login Card -->
<div class="bg-surface-container-low rounded-lg p-8 shadow-[0_16px_32px_rgba(0,0,0,0.4)] relative overflow-hidden">
<!-- Branding Context -->
<div class="mb-10 text-center">
<h1 class="font-headline font-extrabold text-4xl text-on-surface mb-2 tracking-tight">Sovereign Vault</h1>
<p class="font-label text-on-surface-variant text-sm uppercase tracking-[0.2em]">Enter your secure access credentials</p>
</div>
<form class="space-y-6">
<!-- Email Field -->
<div class="space-y-2">
<label class="block font-label text-on-surface text-xs font-bold uppercase tracking-wider ml-1" for="email">Vault ID / Email</label>
<div class="relative">
<input class="w-full bg-surface-container-highest border-none rounded-xl py-4 px-5 text-on-surface font-body focus:ring-2 focus:ring-primary/40 focus:bg-surface-container-highest transition-all outline-none" id="email" placeholder="name@vault.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-center px-1">
<label class="block font-label text-on-surface text-xs font-bold uppercase tracking-wider" for="password">Access Key</label>
<a class="text-primary text-[11px] font-bold uppercase tracking-tighter hover:opacity-80 transition-opacity" href="#">Forgot Key?</a>
</div>
<div class="relative">
<input class="w-full bg-surface-container-highest border-none rounded-xl py-4 px-5 text-on-surface font-body focus:ring-2 focus:ring-primary/40 focus:bg-surface-container-highest transition-all outline-none" id="password" placeholder="••••••••••••" type="password"/>
</div>
</div>
<!-- Action Button -->
<div class="pt-2">
<button class="w-full bg-gradient-to-br from-secondary to-secondary-container text-on-secondary font-headline font-bold text-lg py-4 rounded-xl shadow-[0_8px_24px_rgba(64,229,108,0.25)] hover:opacity-90 active:scale-[0.98] transition-all" type="submit">
                            Sign In
                        </button>
</div>
<!-- Divider Contextual Tonal Shift -->
<div class="flex items-center gap-4 py-4">
<div class="h-[1px] flex-grow bg-outline-variant/20"></div>
<span class="font-label text-outline text-[10px] uppercase tracking-widest">Biometric Access</span>
<div class="h-[1px] flex-grow bg-outline-variant/20"></div>
</div>
<!-- Biometric Option -->
<div class="flex justify-center">
<button class="group flex flex-col items-center gap-3 transition-all active:scale-95" type="button">
<div class="w-16 h-16 rounded-full bg-surface-container flex items-center justify-center border border-outline-variant/30 group-hover:border-primary/50 transition-colors">
<span class="material-symbols-outlined text-4xl text-primary" data-icon="face">face</span>
</div>
<span class="font-label text-on-surface-variant text-[10px] font-bold uppercase tracking-widest">Face ID</span>
</button>
</div>
</form>
</div>
<!-- Footer Navigation -->
<div class="mt-12 text-center">
<p class="font-body text-on-surface-variant text-sm">
                    New to the collective? 
                    <a class="text-secondary font-bold ml-1 hover:underline" href="#">Create an account</a>
</p>
</div>
</div>
</main>
<!-- Asymmetric Hero Element (Visual Flourish) -->
<div class="fixed -bottom-24 -left-24 w-64 h-64 rounded-full bg-primary/5 border border-primary/10 pointer-events-none"></div>
<!-- Success Indication Backdrop Image (Decorative) -->
<div class="fixed inset-0 z-[-1] opacity-20">
